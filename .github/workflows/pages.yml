name: Publish research site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify repository commit tree and public manifest
        run: python3 tools/check_release.py --check-manifest --check-commits
      - name: Build static site into isolated dist directory
        run: python3 tools/build.py --output dist
      - name: Verify final website artifact before deployment
        run: |
          python3 tools/check_release.py --check-artifact dist
          python3 tests/check_site.py --site-dir dist
      - name: Check browser JavaScript
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find dist -type f -name '*.js' -print0)
      - name: Run release guard unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
